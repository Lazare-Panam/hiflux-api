services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiflux-api
    ports:
      - "8081:8080" 
    environment:
      # --- MongoDB (secret -> .env) ---
      - MongoDbSettings__ConnectionString=${MONGO_CONNECTION_STRING}
      - MongoDbSettings__DatabaseName=${MONGO_DATABASE_NAME}
      # --- SQL Server (secret -> .env) ---
      - ConnectionStrings__DefaultConnection=${SQL_CONNECTION_STRING}
      # --- Email / Azure Communication Services ---
      - EmailSettings__ConnectionString=${EMAIL_CONNECTION_STRING}
      - EmailSettings__SenderAddress=DoNotReply@d6658aad-4241-41a8-9e02-c5bedb13175b.azurecomm.net
      - EmailSettings__InternalAddressEmail=sales@hiflux.uk.com
      # --- JWT (Key is a secret -> .env) ---
      - JwtSettings__Key=${JWT_KEY}
      - JwtSettings__Issuer=Mars.API
      - JwtSettings__Audience=Mars.Client
      - JwtSettings__ExpireMinutes=60
      # --- CORS ---
      - Cors__AllowedOrigins__0=http://localhost:3000
      # --- Runtime environment ---
      - ASPNETCORE_ENVIRONMENT=${APP_ENV}
    extra_hosts:
      - "host.docker.internal:host-gateway"

